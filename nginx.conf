# nginx public front door for noVNC.
#
# One public port, two jobs:
#   /            -> noVNC client (autoconnect)
#   /websockify  -> WebSocket upgrade straight to websockify
#
# nginx terminates Basic Auth and proxies the WebSocket natively, so there is
# no Python socket pump in the path: the connection survives idle periods and
# reloads.
#
# Placeholders substituted by start.sh: __PORT__ __WS_PORT__

worker_processes 1;
user www-data;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream desktop_ws {
        server 127.0.0.1:__WS_PORT__;
    }

    server {
        listen __PORT__ default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /api/status {
            add_header Cache-Control "no-store";
            default_type application/json;
            return 200 '{"ok":true,"status":{"ready":true,"engine":"noVNC + websockify","desktop":"static"}}';
        }

        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
            default_type text/plain;
        }

        location = /favicon.ico {
            return 204;
        }

        # --- the noVNC client, auto-connected -------------------------------
        location = / {
            auth_basic "Cloud Desktop";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://desktop_ws/vnc.html?autoconnect=1&resize=remote&reconnect=1&quality=5&compression=2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --- the WebSocket ---------------------------------------------------
        location / {
            auth_basic "Cloud Desktop";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://desktop_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }
    }
}
